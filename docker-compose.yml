services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webshop
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: webshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webshop -d webshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: webshop
      RABBITMQ_DEFAULT_PASS: webshop
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  shop-service:
    build: ./shop-service
    environment:
      SERVICE_NAME: shop-service
      SERVICE_PORT: 8000
      DATABASE_URL: postgresql://webshop:webshop@postgres:5432/shop_service
      RABBITMQ_URL: amqp://webshop:webshop@rabbitmq:5672/
      AUDIT_SERVICE_URL: http://audit-service:8004
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8001
      INVOICE_CIRCUIT_BREAKER_FAILURE_THRESHOLD: 3
      INVOICE_CIRCUIT_BREAKER_RESET_SECONDS: 30
      INVOICE_CIRCUIT_BREAKER_HALF_OPEN_MAX_CALLS: 1
      INVOICE_MAX_RETRIES: 3
      INVOICE_RETRY_BACKOFF_SECONDS: 0.2
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_COOKIE_SECURE: "false"
      PRODUCT_IMAGE_UPLOAD_DIR: /app/uploads/product-images
      SHOP_PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - shop-image-uploads:/app/uploads/product-images
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  warehouse-service:
    build: ./warehouse-service
    environment:
      SERVICE_NAME: warehouse-service
      SERVICE_PORT: 8001
      DATABASE_URL: postgresql://webshop:webshop@postgres:5432/warehouse_service
      RABBITMQ_URL: amqp://webshop:webshop@rabbitmq:5672/
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  billing-service:
    build: ./billing-service
    environment:
      SERVICE_NAME: billing-service
      SERVICE_PORT: 8002
      RABBITMQ_URL: amqp://webshop:webshop@rabbitmq:5672/
      PAYMENT_PROVIDER: stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PAYMENT_METHOD: ${STRIPE_PAYMENT_METHOD:-pm_card_visa}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      SHOP_FRONTEND_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ASYNC_PAYMENT_WEBHOOK_URL: http://billing-service:8002/webhooks/payment-stub
      ASYNC_PAYMENT_WEBHOOK_DELAY_SECONDS: ${ASYNC_PAYMENT_WEBHOOK_DELAY_SECONDS:-30}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  invoice-service:
    build: ./invoice-service
    environment:
      SERVICE_NAME: invoice-service
      SERVICE_PORT: 8003
      DATABASE_URL: postgresql://webshop:webshop@postgres:5432/invoice_service
      INVOICE_OUTPUT_DIR: /app/invoices
      RABBITMQ_URL: amqp://webshop:webshop@rabbitmq:5672/
    ports:
      - "8003:8003"
    volumes:
      - invoice-data:/app/invoices
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit-service:
    build: ./audit-service
    environment:
      SERVICE_NAME: audit-service
      SERVICE_PORT: 8004
      DATABASE_URL: postgresql://webshop:webshop@postgres:5432/audit_service
      RABBITMQ_URL: amqp://webshop:webshop@rabbitmq:5672/
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_SHOP_API_URL: http://localhost:8000
      VITE_AUDIT_API_URL: http://localhost:8004
    ports:
      - "3000:80"
    depends_on:
      - shop-service
      - audit-service

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

volumes:
  postgres-data:
  shop-image-uploads:
  invoice-data:
  loki-data:
  grafana-data:

openapi: 3.0.3
info:
  title: Warehouse Service API
  version: 0.1.0
  description: Internal warehouse service. Business communication uses RabbitMQ.
servers:
  - url: http://localhost:8001
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: warehouse-service

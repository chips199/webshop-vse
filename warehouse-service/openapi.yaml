openapi: 3.0.3
info:
  title: Warehouse Service API
  version: 0.1.0
  description: Internal warehouse service. Business communication uses RabbitMQ.
servers:
  - url: http://localhost:8001
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /stock:
    get:
      summary: List warehouse stock
      operationId: listStock
      responses:
        "200":
          description: Current stock per product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockResponse"
    post:
      summary: Create warehouse stock for a product
      operationId: createStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockCreateRequest"
      responses:
        "200":
          description: Created stock entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
  /stock/{productId}:
    patch:
      summary: Update warehouse stock for one product
      operationId: updateStock
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockUpdateRequest"
      responses:
        "200":
          description: Updated stock entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "404":
          description: Stock entry not found
        "409":
          description: Quantity cannot be lower than reserved stock
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: warehouse-service
    StockResponse:
      type: object
      required: [productId, quantityOnHand, reservedQuantity, availableQuantity, location]
      properties:
        productId:
          type: string
          format: uuid
        quantityOnHand:
          type: integer
          minimum: 0
        reservedQuantity:
          type: integer
          minimum: 0
        availableQuantity:
          type: integer
          minimum: 0
        location:
          type: string
    StockUpdateRequest:
      type: object
      required: [quantityOnHand]
      properties:
        quantityOnHand:
          type: integer
          minimum: 0
        location:
          type: string
          nullable: true
    StockCreateRequest:
      allOf:
        - $ref: "#/components/schemas/StockUpdateRequest"
        - type: object
          required: [productId]
          properties:
            productId:
              type: string
              format: uuid

openapi: 3.0.3
info:
  title: Warehouse Service API
  version: 0.1.0
  description: Internal warehouse service. Business communication uses RabbitMQ.
servers:
  - url: http://localhost:8001
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /stock:
    get:
      summary: List warehouse stock
      operationId: listStock
      responses:
        "200":
          description: Current stock per product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: warehouse-service
    StockResponse:
      type: object
      required: [productId, quantityOnHand, reservedQuantity, availableQuantity, location]
      properties:
        productId:
          type: string
          format: uuid
        quantityOnHand:
          type: integer
          minimum: 0
        reservedQuantity:
          type: integer
          minimum: 0
        availableQuantity:
          type: integer
          minimum: 0
        location:
          type: string

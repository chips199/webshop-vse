openapi: 3.0.3
info:
  title: Billing Service API
  version: 0.1.0
  description: Internal billing service. Business communication uses RabbitMQ.
servers:
  - url: http://localhost:8002
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /payments/{transactionId}/status:
    get:
      summary: Get payment status for diagnostics
      operationId: getPaymentStatus
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "404":
          description: Transaction not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /webhooks/payment-stub:
    post:
      summary: Receive asynchronous payment stub confirmation
      operationId: receiveAsyncPaymentWebhook
      description: Internal webhook endpoint used by the PayPal stub (no sandbox credentials configured) to continue the RabbitMQ saga after a delayed payment result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsyncPaymentWebhookRequest"
      responses:
        "200":
          description: Webhook accepted and translated to billing.payment.succeeded or billing.payment.failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncPaymentWebhookResponse"
        "400":
          description: Unsupported payment status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: billing-service
    PaymentStatusResponse:
      type: object
      required: [transactionId, provider, status]
      properties:
        transactionId:
          type: string
        provider:
          type: string
          enum: [paypal, stripe]
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, REFUNDED]
    AsyncPaymentWebhookRequest:
      type: object
      required: [orderId, transactionId, provider, amount, currency, status, correlationId]
      properties:
        orderId:
          type: string
        transactionId:
          type: string
        provider:
          type: string
          default: paypal
        amount:
          type: string
          example: "49.90"
        currency:
          type: string
          default: EUR
        status:
          type: string
          enum: [SUCCEEDED, FAILED]
        correlationId:
          type: string
        previousEventId:
          type: string
          nullable: true
        reasonCode:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        scenario:
          type: string
          default: async_webhook
    AsyncPaymentWebhookResponse:
      type: object
      required: [accepted, eventType]
      properties:
        accepted:
          type: boolean
        eventType:
          type: string
          enum: [billing.payment.succeeded, billing.payment.failed]
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

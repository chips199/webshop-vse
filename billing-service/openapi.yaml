openapi: 3.0.3
info:
  title: Billing Service API
  version: 0.1.0
  description: Internal billing service. Business communication uses RabbitMQ.
servers:
  - url: http://localhost:8002
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /payments/{transactionId}/status:
    get:
      summary: Get payment status for diagnostics
      operationId: getPaymentStatus
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "404":
          description: Transaction not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /paypal/orders:
    post:
      summary: Create PayPal checkout order
      operationId: createPayPalOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalCreateOrderRequest"
      responses:
        "200":
          description: PayPal order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalCreateOrderResponse"
        "502":
          description: Payment provider error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /paypal/orders/{paypalOrderId}/capture:
    post:
      summary: Capture approved PayPal order
      operationId: capturePayPalOrder
      parameters:
        - name: paypalOrderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PayPal order captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalCaptureResponse"
  /stripe/sessions:
    post:
      summary: Create Stripe Checkout Session
      operationId: createStripeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeCreateSessionRequest"
      responses:
        "200":
          description: Stripe Checkout Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCreateSessionResponse"
  /stripe/sessions/{sessionId}:
    get:
      summary: Retrieve Stripe Checkout Session
      operationId: getStripeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stripe session status and collected checkout data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeSessionResponse"
  /webhooks/payment-stub:
    post:
      summary: Receive asynchronous payment stub confirmation
      operationId: receiveAsyncPaymentWebhook
      description: Internal webhook endpoint used by the async-stub provider to continue the RabbitMQ saga after a delayed payment result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsyncPaymentWebhookRequest"
      responses:
        "200":
          description: Webhook accepted and translated to billing.payment.succeeded or billing.payment.failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncPaymentWebhookResponse"
        "400":
          description: Unsupported payment status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: billing-service
    PaymentStatusResponse:
      type: object
      required: [transactionId, provider, status]
      properties:
        transactionId:
          type: string
        provider:
          type: string
          enum: [paypal, stripe, async-stub]
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, REFUNDED]
    PayPalCreateOrderRequest:
      type: object
      required: [referenceId, amount]
      properties:
        referenceId:
          type: string
        amount:
          type: string
        currency:
          type: string
          default: EUR
        returnUrl:
          type: string
          nullable: true
        cancelUrl:
          type: string
          nullable: true
    PayPalCreateOrderResponse:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
        status:
          type: string
        approveUrl:
          type: string
          nullable: true
        stub:
          type: boolean
    PayPalCaptureResponse:
      type: object
      required: [orderId, captureId, status]
      properties:
        orderId:
          type: string
        captureId:
          type: string
        status:
          type: string
        payer:
          type: object
          nullable: true
        shippingAddress:
          type: object
          nullable: true
        stub:
          type: boolean
    StripeCheckoutItem:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
        amount:
          type: string
        quantity:
          type: integer
          default: 1
    StripeCreateSessionRequest:
      type: object
      required: [referenceId, amount]
      properties:
        referenceId:
          type: string
        amount:
          type: string
        currency:
          type: string
          default: EUR
        successUrl:
          type: string
          nullable: true
        cancelUrl:
          type: string
          nullable: true
        customerEmail:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/StripeCheckoutItem"
    StripeCreateSessionResponse:
      type: object
      required: [sessionId, status, paymentStatus]
      properties:
        sessionId:
          type: string
        status:
          type: string
        paymentStatus:
          type: string
        checkoutUrl:
          type: string
          nullable: true
        stub:
          type: boolean
    StripeSessionResponse:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
        status:
          type: string
          nullable: true
        paymentStatus:
          type: string
          nullable: true
        customer:
          type: object
          nullable: true
        shippingAddress:
          type: object
          nullable: true
        stub:
          type: boolean
    AsyncPaymentWebhookRequest:
      type: object
      required: [orderId, transactionId, provider, amount, currency, status, correlationId]
      properties:
        orderId:
          type: string
        transactionId:
          type: string
        provider:
          type: string
          default: async-stub
        amount:
          type: string
          example: "49.90"
        currency:
          type: string
          default: EUR
        status:
          type: string
          enum: [SUCCEEDED, FAILED]
        correlationId:
          type: string
        previousEventId:
          type: string
          nullable: true
        reasonCode:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        scenario:
          type: string
          default: async_webhook
    AsyncPaymentWebhookResponse:
      type: object
      required: [accepted, eventType]
      properties:
        accepted:
          type: boolean
        eventType:
          type: string
          enum: [billing.payment.succeeded, billing.payment.failed]
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
